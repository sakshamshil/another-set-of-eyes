{% extends "base.html" %}

{% block title %}{{ doc.title }}{% endblock %}

{% block content %}
<div class="doc-view-container">
  <div class="doc-header">
    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
      <div>
        <div class="doc-badges">
          <span class="badge">{{ doc.status }}</span>
          <span class="badge">{{ doc.metadata.source or 'unknown' }}</span>
        </div>
        <h1>{{ doc.title }}</h1>
        <div style="color: var(--text-dim); font-size: 0.9em; margin-top: 8px;">
          Updated {{ doc.updated_at | timeago }}
        </div>
      </div>
      <div class="doc-actions">
        <button class="btn-text" onclick="TabManager.load_tab_content('{{ doc.id }}')" style="display: flex; align-items: center; gap: 6px;" title="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px;">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          Refresh
        </button>
        {% if doc.status == 'active' %}
        <button class="btn-text" onclick="DocumentCreator.edit('{{ doc.id }}')" style="display: flex; align-items: center; gap: 6px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px;">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
          Edit
        </button>
        <button class="btn-text" onclick="DocumentManager.archive('{{ doc.id }}', true)" style="display: flex; align-items: center; gap: 6px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px;">
            <polyline points="21 8 21 21 3 21 3 8"></polyline>
            <rect x="1" y="3" width="22" height="5"></rect>
            <line x1="10" y1="12" x2="14" y2="12"></line>
          </svg>
          Archive
        </button>
        {% else %}
        <button class="btn-text" onclick="DocumentManager.unarchive('{{ doc.id }}', true)" style="display: flex; align-items: center; gap: 6px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px;">
            <polyline points="21 8 21 21 3 21 3 8"></polyline>
            <rect x="1" y="3" width="22" height="5"></rect>
            <polyline points="10 14 12 12 14 14"></polyline>
            <line x1="12" y1="12" x2="12" y2="17"></line>
          </svg>
          Unarchive
        </button>
        {% endif %}
      </div>
    </div>
  </div>

  <article class="markdown-body">
    <!-- Content rendered by app.js -->
  </article>

  <!-- Raw content for JS to pick up -->
  <script type="application/json" class="raw-markdown">{{ doc.content | tojson }}</script>
</div>
{% endblock %}
