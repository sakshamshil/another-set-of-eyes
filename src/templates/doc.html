{% extends "base.html" %}

{% block title %}{{ doc.title }}{% endblock %}

{% block content %}
<div class="doc-view-container">
  <div class="doc-header">
    <div class="doc-meta">
      <span class="badge">{{ doc.status }}</span>
      <span class="doc-updated">{{ doc.metadata.source or 'unknown' }} · {{ doc.updated_at | timeago }}</span>
    </div>
    <div class="doc-actions">
      <button class="icon-btn" onclick="TabManager.load_tab_content('{{ doc.id }}')" title="Refresh" aria-label="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
      </button>
      {% if doc.status == 'active' %}
      <button class="icon-btn" onclick="DocumentCreator.edit('{{ doc.id }}')" title="Edit" aria-label="Edit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
        </svg>
      </button>
      <button class="icon-btn" onclick="DocumentManager.archive('{{ doc.id }}', true)" title="Archive" aria-label="Archive">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="21 8 21 21 3 21 3 8"></polyline>
          <rect x="1" y="3" width="22" height="5"></rect>
          <line x1="10" y1="12" x2="14" y2="12"></line>
        </svg>
      </button>
      {% else %}
      <button class="icon-btn" onclick="DocumentManager.unarchive('{{ doc.id }}', true)" title="Unarchive" aria-label="Unarchive">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="21 8 21 21 3 21 3 8"></polyline>
          <rect x="1" y="3" width="22" height="5"></rect>
          <polyline points="10 14 12 12 14 14"></polyline>
          <line x1="12" y1="12" x2="12" y2="17"></line>
        </svg>
      </button>
      {% endif %}
    </div>
  </div>

  <article class="markdown-body">
    <!-- Content rendered by app.js -->
  </article>

  <!-- Raw content for JS to pick up -->
  <script type="application/json" class="raw-markdown">{{ doc.content | tojson }}</script>
</div>
{% endblock %}
