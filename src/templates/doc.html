{% extends "base.html" %}

{% block title %}{{ doc.title }}{% endblock %}

{% block content %}
<div class="doc-view-container">
  <div class="doc-header">
    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
      <div>
        <div class="doc-badges">
          <span class="badge">{{ doc.status }}</span>
          <span class="badge">{{ doc.metadata.source or 'unknown' }}</span>
        </div>
        <h1>{{ doc.title }}</h1>
        <div style="color: var(--text-dim); font-size: 0.9em; margin-top: 8px;">
          Updated {{ doc.updated_at | timeago }}
        </div>
      </div>
      <div class="doc-actions">
        <button class="btn-text" onclick="DocumentCreator.edit('{{ doc.id }}')" style="display: flex; align-items: center; gap: 6px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px;">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
          Edit
        </button>
      </div>
    </div>
  </div>

  <article class="markdown-body">
    <!-- Content rendered by app.js -->
  </article>

  <!-- Raw content for JS to pick up -->
  <script type="text/plain" class="raw-markdown">{{ doc.content | safe }}</script>
</div>
{% endblock %}
