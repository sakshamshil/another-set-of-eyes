{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="dashboard-container">
  <div class="dashboard-header">
    <div class="dashboard-title-area">
      <h1 class="dashboard-title">Documents</h1>
      <div class="status-indicator" id="sse-indicator">
        <div class="status-dot" id="sse-status"></div>
        <span class="status-label" id="sse-label">...</span>
      </div>
    </div>
    <div class="dashboard-actions">
      <button class="btn-text btn-add" onclick="DocumentCreator.open()">+ New</button>
      <button class="btn-text" hx-get="/partials/doc-list" hx-target="#document-list" hx-swap="innerHTML">
        Refresh
      </button>
      <button class="btn-text btn-danger" onclick="DocumentManager.clearAll(this)">
        Clear All
      </button>
    </div>
  </div>

  <div id="document-list" hx-get="/partials/doc-list" hx-trigger="load, refresh" hx-swap="innerHTML">
    <div class="loading">Loading library...</div>
  </div>

  <div class="agent-connect">
    <div class="agent-connect-label">Connect your agent</div>
    <div class="agent-connect-command">
      <code id="install-cmd">npx asoe-install</code>
      <button class="agent-connect-copy" onclick="AgentInstall.copy()" title="Copy">
        <svg id="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      </button>
    </div>
    <p class="agent-connect-hint">Installs the skill for Claude Code, Cursor, OpenCode and more.</p>
  </div>
</div>
{% endblock %}
