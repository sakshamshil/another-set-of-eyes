{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="dashboard-container">
  <div class="dashboard-header">
    <div class="dashboard-title-area">
      <h1 class="dashboard-title">Documents</h1>
      <div class="view-toggle-group">
        <button class="btn-text view-btn active" data-status="active" data-action="set-status">Active</button>
        <button class="btn-text view-btn" data-status="archived" data-action="set-status">Archived</button>
      </div>
    </div>
    <div class="dashboard-actions">
      <button class="btn-text btn-add" data-action="new-doc">+ New</button>
      <button class="btn-text btn-danger" data-action="clear-all">
        Clear All
      </button>
    </div>
  </div>

  <div id="document-list" hx-get="/partials/doc-list?status=active" hx-trigger="load, refresh" hx-swap="innerHTML">
    <div class="loading">Loading library...</div>
  </div>
</div>
{% endblock %}
